name: Kronos live data
# Fetches the universe AND runs the scan on GitHub's runners, which can reach
# Yahoo. On a TAKE it opens a GitHub issue, and GitHub emails/pushes that to
# the repo owner — so alerts do not depend on a Claude session being awake.
#
# This exists because in-session cron proved unreliable (three registrations,
# all silently cleared while the session was still active), whereas this
# workflow has fired on schedule every time.
#
# Free tier: unlimited on public repos, ~150 min/mo of the 2000 free otherwise.

on:
  schedule:
    # Every 15 min during US market hours (13:30-20:00 UTC, Mon-Fri).
    # GitHub cron drifts 5-15 min under load: fine for swing, not for scalping.
    - cron: '*/15 13-20 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: kronos-data
  cancel-in-progress: false

env:
  KRONOS_STRATEGY: agent.strategies.episodic_pivot:EpisodicPivotStrategy
  KRONOS_ACCOUNT_SIZE: '570'
  KRONOS_RISK_PER_TRADE: '0.04'
  KRONOS_TZ: America/Denver

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --upgrade yfinance pandas numpy scipy hmmlearn pyarrow curl_cffi

      - name: fetch universe
        run: python kronos-scanner/backend/fetch_relay.py

      - name: commit data
        run: |
          git config user.name  "kronos-data-bot"
          git config user.email "kronos-data-bot@users.noreply.github.com"
          git add data/live/
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || true

      - name: scan
        id: scan
        working-directory: kronos-scanner/backend
        run: |
          set +e
          python scan_cli.py --no-news --ignore-session > /tmp/scan.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          # Strip yfinance noise; keep the report and any ALERT lines.
          grep -viE 'warning|converg|^\[|Failed|Connection|delisted|possibly' /tmp/scan.txt \
            > /tmp/clean.txt || true
          tail -30 /tmp/clean.txt
          # ALERT lines are what matter — they are the new TAKEs.
          grep '^ALERT:' /tmp/clean.txt > /tmp/alerts.txt || true
          echo "alert_count=$(wc -l < /tmp/alerts.txt)" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<KRONOS_EOF'
            tail -30 /tmp/clean.txt
            echo 'KRONOS_EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'alerts<<KRONOS_EOF'
            cat /tmp/alerts.txt
            echo 'KRONOS_EOF'
          } >> "$GITHUB_OUTPUT"

      # An issue notifies the repo owner by email and GitHub mobile push. Only
      # opened when there is a genuinely new TAKE, so a quiet market is silent.
      - name: alert on TAKE
        if: steps.scan.outputs.alert_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = `${{ steps.scan.outputs.alerts }}`.trim();
            const report = `${{ steps.scan.outputs.report }}`.trim();
            const first = alerts.split('\n')[0].replace(/^ALERT:\s*/, '');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `TAKE — ${first}`,
              body: [
                '## New setup', '```', alerts, '```',
                '', '## Full scan', '```', report, '```',
                '', `_${new Date().toISOString()} · Episodic Pivot · stop is in the alert line._`,
              ].join('\n'),
              labels: ['kronos-alert'],
            });

      - name: flag data failure
        if: steps.scan.outputs.exit_code == '2' || steps.scan.outputs.exit_code == '3'
        run: |
          echo "::warning::Kronos scan had a data problem (exit ${{ steps.scan.outputs.exit_code }})"
