name: Kronos routine
# The agent's daily routine, run on GitHub's runners rather than in a Claude
# session — in-session cron proved unreliable (three registrations, all
# silently cleared while the session was still active), whereas this has fired
# on schedule every time.
#
#   premarket   13:25 UTC   08:25 CT   data health before the open
#   session     */15        08:30-15:00 CT  fetch, scan, alert, journal
#   wrap        21:10 UTC   16:10 CT   mark outcomes, post the day's stats
#
# Free tier: unlimited on public repos, ~200 min/mo of the 2000 free otherwise.

# PAUSED — superseded by qqq-bot.yml. The user wants index signals, not
# Episodic Pivots. Uncomment to bring the stock scanner back.
on:
  # schedule:
  #   - cron: '25 13 * * 1-5'
  #   - cron: '*/15 13-20 * * 1-5'
  #   - cron: '10 21 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: kronos-routine
  cancel-in-progress: false

env:
  KRONOS_STRATEGY: agent.strategies.episodic_pivot:EpisodicPivotStrategy
  KRONOS_ACCOUNT_SIZE: '570'
  KRONOS_RISK_PER_TRADE: '0.04'
  KRONOS_TZ: America/Chicago

jobs:
  routine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install --upgrade yfinance pandas numpy scipy hmmlearn pyarrow curl_cffi

      # Which phase of the routine is this? The wrap cron fires at :10, the
      # premarket one at :25 of hour 13; everything else is a session sweep.
      - name: identify phase
        id: phase
        run: |
          H=$(date -u +%H); M=$(date -u +%M)
          if   [ "$H" = "21" ]; then P=wrap
          elif [ "$H" = "13" ] && [ "$M" -ge 20 ] && [ "$M" -lt 30 ]; then P=premarket
          else P=session; fi
          echo "phase=$P" >> "$GITHUB_OUTPUT"
          echo "Phase: $P ($(date -u +%H:%M) UTC)"

      - name: fetch universe
        run: python kronos-scanner/backend/fetch_relay.py

      - name: scan
        id: scan
        working-directory: kronos-scanner/backend
        run: |
          set +e
          python scan_cli.py --no-news --ignore-session > /tmp/scan.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          grep -viE 'warning|converg|^\[|Failed|Connection|delisted|possibly' /tmp/scan.txt \
            > /tmp/clean.txt || true
          tail -30 /tmp/clean.txt
          grep '^ALERT:'  /tmp/clean.txt > /tmp/alerts.txt || true
          grep '^CLOSED:' /tmp/clean.txt > /tmp/closed.txt || true
          echo "alert_count=$(wc -l < /tmp/alerts.txt)"  >> "$GITHUB_OUTPUT"
          echo "closed_count=$(wc -l < /tmp/closed.txt)" >> "$GITHUB_OUTPUT"
          for n in report:/tmp/clean.txt alerts:/tmp/alerts.txt closed:/tmp/closed.txt; do
            k=${n%%:*}; f=${n##*:}
            { echo "$k<<KRONOS_EOF"; tail -30 "$f"; echo 'KRONOS_EOF'; } >> "$GITHUB_OUTPUT"
          done

      # Commit AFTER the scan: the scan writes journal.json, so committing
      # before it would persist the data but silently lose every outcome.
      - name: commit data + journal
        run: |
          git config user.name  "kronos-bot"
          git config user.email "kronos-bot@users.noreply.github.com"
          git add data/live/
          git diff --cached --quiet || git commit -m "kronos ${{ steps.phase.outputs.phase }}: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push || true

      # An issue emails and mobile-pushes the repo owner, so alerting does not
      # depend on any Claude session being awake.
      - name: alert on TAKE
        if: steps.scan.outputs.alert_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const alerts = `${{ steps.scan.outputs.alerts }}`.trim();
            const report = `${{ steps.scan.outputs.report }}`.trim();
            const first = alerts.split('\n')[0].replace(/^ALERT:\s*/, '');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `TAKE — ${first}`,
              body: ['## New setup','```',alerts,'```','',
                     '## Scan','```',report,'```','',
                     `_${new Date().toISOString()} · stop is in the alert line._`].join('\n'),
              labels: ['kronos-alert'],
              assignees: [context.repo.owner],
            });

      - name: daily wrap
        if: steps.phase.outputs.phase == 'wrap'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.scan.outputs.report }}`.trim();
            const closed = `${{ steps.scan.outputs.closed }}`.trim();
            const day = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Kronos wrap — ${day}`,
              body: ['## Closed today','```', closed || 'none','```','',
                     '## End of day','```', report,'```','',
                     '_Journal: data/live/journal.json — win rate and expectancy',
                     'are unreliable below ~20 closed trades._'].join('\n'),
              labels: ['kronos-wrap'],
              assignees: [context.repo.owner],
            });

      - name: flag data failure
        if: steps.scan.outputs.exit_code == '2' || steps.scan.outputs.exit_code == '3'
        run: echo "::warning::Kronos data problem (exit ${{ steps.scan.outputs.exit_code }})"
